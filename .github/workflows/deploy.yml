name: Deploy to GitHub Pages

# Build, test, and publish the PWA to GitHub Pages on every push to the dev
# branch. Deploy only happens if the e2e tests pass. main is intentionally not
# deployed yet (a formal URL will be set up later).
on:
  push:
    branches:
      - claude/calorie-tracking-pwa-cu1mlj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build for the Pages subpath
        run: npm run build
        env:
          # GitHub Pages serves a project repo at /<repo>/, so the bundle,
          # manifest, and service worker scope must be built for that base.
          VITE_BASE: /fat-track/
          # Free-tier Gemini key for the optional Estimate button. Embedded in the
          # public bundle by design (free tier = no billing). Unset -> button hidden.
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
